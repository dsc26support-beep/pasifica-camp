<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pasifika Campus — Primary Horizontal Logo (Logo Concept 2)
  Pacific emblem (palm + island/mountain + sun + waves) in gold/grey with the
  PASIFIKA CAMPUS wordmark, premium horizontal composition on charcoal.
  Vector placeholder following the APPROVED direction. Replace with final
  approved artwork when supplied; keep viewBox + colour tokens.
-->
<svg width="880" height="240" viewBox="0 0 880 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pasifika Campus">
  <rect width="880" height="240" fill="#0D0D0D"/>
  <!-- Emblem -->
  <g transform="translate(40,28)">
    <!-- Sun -->
    <circle cx="92" cy="60" r="30" fill="#D4AF37"/>
    <!-- Island / mountain -->
    <path d="M20 150 L92 66 L164 150 Z" fill="#252525"/>
    <path d="M92 66 L128 108 L92 150 L56 108 Z" fill="#6B6B6B" opacity="0.5"/>
    <!-- Palm -->
    <path d="M92 150 q-6 -46 6 -84" stroke="#D4AF37" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g stroke="#D4AF37" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M98 66 q30 -22 66 -14"/>
      <path d="M98 66 q22 -34 60 -44"/>
      <path d="M98 66 q-4 -40 -34 -62"/>
      <path d="M98 66 q-30 -22 -66 -14"/>
    </g>
    <!-- Waves -->
    <path d="M8 170 q22 -16 44 0 t44 0 t44 0 t44 0" stroke="#6B6B6B" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M8 188 q22 -16 44 0 t44 0 t44 0 t44 0" stroke="#D4AF37" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="240" y="118" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="1" fill="#FFFFFF">PASIFIKA</text>
  <text x="240" y="176" font-family="Poppins, Montserrat, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="10" fill="#D4AF37">CAMPUS</text>
</svg>
